# OpenClaw install form. Writes only .env; docker-compose.yml turns these into the
# container's config (provider key + gateway token + init model) at start.
title: OpenClaw Gateway
eyebrow: SoloHost App
description: |
  An AI assistant that runs on your node. To use it, connect an active API key from a
  supported provider (such as Anthropic or OpenAI). Your conversations are processed by
  that provider, as with any cloud AI service.

  Pick your provider and add its API key. OpenRouter gives you models from many companies
  with one key. The access token you set is your login, and you can switch models anytime
  in the app.
output_file: .env
after_save: >
  Saved. Install / redeploy the package to apply. When OpenClaw opens, sign in with the
  Control UI access token you set above.

fields:
  - name: OPENCLAW_GATEWAY_TOKEN
    label: Control UI access token
    type: password
    preserve_if_blank: true
    required: true
    help: >
      This is your login. Choose any value and save it — after install you'll paste
      this exact token into the OpenClaw Control UI (Settings → token) to sign in.
    env_comment: Shared secret that gates access to the OpenClaw Control UI.

  - name: MODEL_PROVIDER
    label: Model provider
    type: select
    default: anthropic
    help: Choose your LLM provider, then enter that provider's API key below.
    env_comment: The provider OpenClaw starts on; startup maps it to a supported model.
    options:
      - value: anthropic
        label: Anthropic (Claude)
      - value: openai
        label: OpenAI
      - value: openrouter
        label: OpenRouter (many models, one key)

  - name: ANTHROPIC_API_KEY
    label: Anthropic API key
    type: password
    preserve_if_blank: true
    required: false
    help: From console.anthropic.com. Must be valid and funded.
    env_comment: API key used when the provider is Anthropic.
    visible_if:
      field: MODEL_PROVIDER
      in: [anthropic]

  - name: OPENAI_API_KEY
    label: OpenAI API key
    type: password
    preserve_if_blank: true
    required: false
    help: From platform.openai.com. Must be valid and funded.
    env_comment: API key used when the provider is OpenAI.
    visible_if:
      field: MODEL_PROVIDER
      in: [openai]

  - name: OPENROUTER_API_KEY
    label: OpenRouter API key
    type: password
    preserve_if_blank: true
    required: false
    help: From openrouter.ai/keys. One key reaches models from many companies.
    env_comment: API key used when the provider is OpenRouter.
    visible_if:
      field: MODEL_PROVIDER
      in: [openrouter]
