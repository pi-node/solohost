# OpenClaw AI — self-hosted personal assistant.
# Public image: ghcr.io/openclaw/openclaw.
#
# Verified on 2026.9.9 by running it in Docker (Colima, not Pi Desktop): the Control UI
# signs in with the access token alone, the chosen provider's key and starting model take
# effect, switching provider on reinstall takes effect, and a model changed inside the app
# survives restarts.
#
# It's a pattern to learn from, not a complete OpenClaw package. It covers model providers
# only, while OpenClaw also has messaging channels (Telegram is built in), web search, a
# browser tool and more. In this release many providers and channels (Mistral, Discord,
# Slack, WhatsApp, ...) are separate plugins, so an API key alone does nothing for them.
#
# Sign-in: OpenClaw makes each new browser get approved, except a Control UI browser that
# reaches it on 127.0.0.1 or localhost with the right token and no proxy headers (its
# "browser_container_local" rule). Pi Desktop opens the app on the loopback host port, so
# that rule applies. Keep the port bound to 127.0.0.1.
services:
  gateway:
    image: ghcr.io/openclaw/openclaw:2026.9.9
    restart: unless-stopped
    init: true
    labels:
      pi.ui.primary: "true"                      # the UI service Pi Desktop surfaces + embeds
    # On start, merge two things into OpenClaw's config:
    # (1) origin fallback, so OpenClaw accepts SoloHost's proxied origin. Without it 2026.9.9
    #     rejects the page with "Browser origin not allowed" when the host port differs
    #     from the container port.
    # (2) the starting model for the provider you picked, applied only when the provider
    #     changes (tracked in .solohost-provider). That way a model picked inside the app
    #     survives restarts, and switching provider on reinstall still takes effect.
    #     Anthropic starts on Haiku 4.5 (inexpensive); OpenAI and OpenRouter start on
    #     OpenClaw's own defaults. All three refs were confirmed live in 2026.9.9.
    command:
      - sh
      - -lc
      - |
        node -e '
          const fs = require("fs");
          const dir = "/home/node/.openclaw", file = dir + "/openclaw.json", marker = dir + "/.solohost-provider";
          fs.mkdirSync(dir, { recursive: true });
          let c = {};
          try { c = JSON.parse(fs.readFileSync(file, "utf8")); } catch (e) {}
          c.gateway = c.gateway || {};
          c.gateway.controlUi = c.gateway.controlUi || {};
          c.gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback = true;
          const provider = (process.env.MODEL_PROVIDER || "").toLowerCase();
          const startModel = { anthropic: "anthropic/claude-haiku-4-5", openai: "openai/gpt-6-astra", openrouter: "openrouter/auto" }[provider];
          let last = "";
          try { last = fs.readFileSync(marker, "utf8").trim(); } catch (e) {}
          if (startModel && provider !== last) {
            c.agents = c.agents || {};
            c.agents.defaults = c.agents.defaults || {};
            c.agents.defaults.model = c.agents.defaults.model || {};
            c.agents.defaults.model.primary = startModel;
            fs.writeFileSync(marker, provider);
          }
          fs.writeFileSync(file, JSON.stringify(c, null, 2));
        '
        exec node dist/index.js gateway --bind lan --port 18990 --allow-unconfigured
    ports:
      - "127.0.0.1:18990:18990"                  # loopback HOST:CONTAINER form; distinctive host port
    environment:
      # Pin config/workspace paths inside the container.
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      # These ${VAR}s are declared in config_options.yml:
      OPENCLAW_GATEWAY_TOKEN: '${OPENCLAW_GATEWAY_TOKEN}'
      MODEL_PROVIDER: '${MODEL_PROVIDER}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY}'
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY}'
    volumes:
      - openclaw_home:/home/node                 # named volume persists config, paired devices + workspace

volumes:
  openclaw_home:
